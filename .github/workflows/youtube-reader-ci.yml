name: YouTube Reader CI

on:
  pull_request:
    paths:
      - 'youtube-reader-chatgpt/**'
      - '.github/workflows/youtube-reader-ci.yml'
  push:
    branches: [main]
    paths:
      - 'youtube-reader-chatgpt/**'
      - '.github/workflows/youtube-reader-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-reader-chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-reader-chatgpt/package.json
      - run: npm install
      - run: node --check server.js
      - run: node --check lib/upstream.js
      - run: node --check lib/validate.js
      - name: Validate plugin package
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          test -f skills/read/SKILL.md
          grep -q '^name: read-youtube-video$' skills/read/SKILL.md
          grep -q '^description:' skills/read/SKILL.md
      - run: npm test
