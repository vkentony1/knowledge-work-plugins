name: YouTube Reader CI

on:
  pull_request:
    paths:
      - 'youtube-reader-chatgpt/**'
      - '.github/workflows/youtube-reader-ci.yml'
  push:
    branches: [main]
    paths:
      - 'youtube-reader-chatgpt/**'
      - '.github/workflows/youtube-reader-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-reader-chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-reader-chatgpt/package.json
      - run: npm install
      - run: node --check server.js
      - run: node --check lib/upstream.js
      - run: node --check lib/validate.js
      - run: node --check lib/mcp.js
      - run: node --check api/mcp.js
      - run: node --check api/health.js
      - run: node --check api/selftest.js
      - run: node --check api/privacy.js
      - run: node --check api/terms.js
      - run: node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
      - run: test -s skills/youtube-read/SKILL.md
      - run: npm test
